<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KOSPI/KOSDAQ Visualizer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>KR Market Visualizer</h1>
        <p id="snapshot-meta">데이터를 불러오는 중</p>
      </div>
      <div class="actions">
        <button id="theme-toggle" title="테마 전환" aria-label="테마 전환">◐</button>
      </div>
    </header>

    <main>
      <section class="controls">
        <label>
          <span>시장</span>
          <select id="market-filter">
            <option value="ALL">전체</option>
            <option value="KOSPI">코스피</option>
            <option value="KOSDAQ">코스닥</option>
          </select>
        </label>
        <label class="search">
          <span>검색</span>
          <input id="search-input" type="search" placeholder="종목명 또는 코드" />
        </label>
        <label>
          <span>정렬</span>
          <select id="sort-select">
            <option value="marketCap:desc">시가총액 높은 순</option>
            <option value="tradingValue:desc">거래대금 높은 순</option>
            <option value="changeRate:desc">등락률 높은 순</option>
            <option value="changeRate:asc">등락률 낮은 순</option>
            <option value="salesGrowth:desc">매출 성장률 높은 순</option>
            <option value="operatingProfitGrowth:desc">영업이익 성장률 높은 순</option>
            <option value="per:asc">PER 낮은 순</option>
          </select>
        </label>
      </section>

      <section class="summary-grid" id="summary-grid"></section>

      <section class="workspace">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>종목</th>
                <th>현재가</th>
                <th>등락률</th>
                <th>거래대금</th>
                <th>매출액</th>
                <th>영업이익</th>
                <th>성장률</th>
                <th>외국인</th>
                <th>PER</th>
                <th>시총</th>
              </tr>
            </thead>
            <tbody id="stock-table"></tbody>
          </table>
        </div>

        <aside class="detail">
          <div class="detail-head">
            <div>
              <p id="selected-market">선택 종목</p>
              <h2 id="selected-title">-</h2>
            </div>
            <span id="selected-code">------</span>
          </div>
          <div class="metric-pairs" id="metric-pairs"></div>
          <div class="chart-card">
            <div class="chart-title">
              <strong>주가 차트</strong>
              <span id="chart-state">캐시 확인 중</span>
            </div>
            <svg id="price-chart" viewBox="0 0 720 300" role="img" aria-label="주가 차트"></svg>
          </div>
        </aside>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
