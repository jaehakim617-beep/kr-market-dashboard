<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KOSPI/KOSDAQ Visualizer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="dark">
    <header class="topbar">
      <div>
        <h1>KR Market Visualizer</h1>
        <p id="snapshot-meta">데이터를 불러오는 중</p>
      </div>
      <button id="theme-toggle" title="테마 전환" aria-label="테마 전환">◐</button>
    </header>

    <main>
      <section class="controls">
        <label>
          <span>시장</span>
          <select id="market-filter">
            <option value="ALL">전체</option>
            <option value="KOSPI">코스피</option>
            <option value="KOSDAQ">코스닥</option>
          </select>
        </label>
        <label class="search">
          <span>검색</span>
          <input id="search-input" type="search" placeholder="종목명 또는 코드" />
        </label>
      </section>

      <section class="workspace">
        <div class="table-wrap">
          <table>
            <colgroup>
              <col class="col-name" />
              <col span="10" />
            </colgroup>
            <thead>
              <tr>
                <th>종목</th>
                <th><button class="sort-button" data-sort="price" type="button">현재가 <span></span></button></th>
                <th><button class="sort-button" data-sort="changeRate" type="button">등락률 <span></span></button></th>
                <th><button class="sort-button" data-sort="tradingValue" type="button">거래대금 <span></span></button></th>
                <th><button class="sort-button" data-sort="sales" type="button">매출액 <span></span></button></th>
                <th><button class="sort-button" data-sort="operatingProfit" type="button">영업익 <span></span></button></th>
                <th><button class="sort-button" data-sort="salesGrowth" type="button">매출증가 <span></span></button></th>
                <th><button class="sort-button" data-sort="operatingProfitGrowth" type="button">영익증가 <span></span></button></th>
                <th><button class="sort-button" data-sort="foreignRatio" type="button">외국인 <span></span></button></th>
                <th><button class="sort-button" data-sort="per" type="button">PER <span></span></button></th>
                <th><button class="sort-button" data-sort="marketCap" type="button">시총 <span></span></button></th>
              </tr>
              <tr class="filter-row">
                <th><button id="clear-filters" type="button">초기화</button></th>
                <th data-filter-cell="price"></th>
                <th data-filter-cell="changeRate"></th>
                <th data-filter-cell="tradingValue"></th>
                <th data-filter-cell="sales"></th>
                <th data-filter-cell="operatingProfit"></th>
                <th data-filter-cell="salesGrowth"></th>
                <th data-filter-cell="operatingProfitGrowth"></th>
                <th data-filter-cell="foreignRatio"></th>
                <th data-filter-cell="per"></th>
                <th data-filter-cell="marketCap"></th>
              </tr>
            </thead>
            <tbody id="stock-table"></tbody>
          </table>
        </div>

        <aside class="chart-panel">
          <div class="chart-toolbar">
            <div>
              <strong id="chart-title">주가 차트</strong>
              <span id="chart-state">종목을 선택하세요</span>
            </div>
            <div class="period-controls" aria-label="차트 주기">
              <button class="period-button active" data-period="day" type="button">일봉</button>
              <button class="period-button" data-period="week" type="button">주봉</button>
              <button class="period-button" data-period="month" type="button">월봉</button>
            </div>
          </div>
          <svg id="price-chart" viewBox="0 0 720 360" role="img" aria-label="봉 차트"></svg>
        </aside>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
